name: Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  # Pull requests are squash-merged, so the title becomes the commit that
  # versions the next release.
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/commit-lint.sh --title "$TITLE"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Warnings and errors: info notes vary between shellcheck versions.
      - name: shellcheck
        run: shellcheck -S warning nightshift install.sh scripts/*.sh scripts/fake/*

  # nightshift runs on macOS (launchd, BSD date), so its tests do too.
  # Split across three machines: a runner's 3 cores are what bound the suite.
  # One seed shuffles the files of all three, so a failure repeats from the run id.
  tests:
    runs-on: macos-latest
    strategy:
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        env:
          NIGHTSHIFT_TEST_SHARD: ${{ matrix.shard }}
          NIGHTSHIFT_TEST_SEED: ${{ github.run_id }}
        run: bash scripts/test.sh
